# Base44 sandbox dev environment for the Live Face Tracking web app.
#
# The browser app is a pure Vite + React frontend: face detection runs in the
# browser via TensorFlow.js, so there is no backend service and no external
# credentials. The optional Python script (live_face_tracking.py) is NOT part of
# the web preview and is intentionally not wired up here.
#
# Source is bind-mounted and dependencies are installed from the committed
# lockfile on startup, so edits are reflected live without rebuilding an image.

services:
  web:
    image: node:22-bookworm
    working_dir: /app
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 5173 --strictPort"]
    ports:
      - "3000:5173"
    environment:
      # Platform-provided flag, passed through (never hardcoded) — see vite.config.ts
      - BASE44_PREVIEW_MODE
      # Vite >= 6.1 appends this to server.allowedHosts automatically.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
    volumes:
      - ./:/app
      # Keep installed dependencies out of the bind-mounted working tree.
      - web_node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    restart: on-failure
    labels:
      base44.project: "Live Face Tracking"
      base44.kind: "web"
      base44.port: "3000"

volumes:
  web_node_modules:
